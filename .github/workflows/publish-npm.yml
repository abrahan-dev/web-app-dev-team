name: Publish npm package

on:
  workflow_dispatch:
    inputs:
      version:
        description: Semantic version to publish, for example 0.1.0-beta.3 or 0.1.0
        required: true
        type: string

permissions:
  contents: write
  id-token: write

concurrency:
  group: publish-npm
  cancel-in-progress: false

jobs:
  publish:
    name: Publish v${{ inputs.version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    env:
      RELEASE_VERSION: ${{ inputs.version }}

    steps:
      - name: Check out main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Read Bun version
        id: stack
        run: echo "bun-version=$(jq -r '.runtime.bun' assets/workspace/stack.json)" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.stack.outputs.bun-version }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Validate release request
        id: release
        shell: bash
        run: |
          if [[ ! "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?(\+[0-9A-Za-z]+([.-][0-9A-Za-z]+)*)?$ ]]; then
            echo "Invalid semantic version: $RELEASE_VERSION" >&2
            exit 1
          fi

          if [[ -n "$(git status --porcelain)" ]]; then
            echo "The main checkout is not clean." >&2
            exit 1
          fi

          RELEASE_TAG="v$RELEASE_VERSION"
          CURRENT_VERSION=$(node -p "require('./package.json').version")
          VERSION_CHANGED=true
          TAG_EXISTS=false
          NPM_EXISTS=false

          if [[ "$CURRENT_VERSION" == "$RELEASE_VERSION" ]]; then
            VERSION_CHANGED=false
          fi

          if git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
            TAG_EXISTS=true
            TAG_COMMIT=$(git rev-list -n 1 "$RELEASE_TAG")
            if [[ "$TAG_COMMIT" != "$(git rev-parse HEAD)" ]]; then
              echo "$RELEASE_TAG does not identify the current main commit." >&2
              exit 1
            fi
            if [[ "$CURRENT_VERSION" != "$RELEASE_VERSION" ]]; then
              echo "$RELEASE_TAG exists, but package.json has version $CURRENT_VERSION." >&2
              exit 1
            fi
          fi

          if npm view "@hagioscopio/web-app-dev-team@$RELEASE_VERSION" version >/dev/null 2>&1; then
            NPM_EXISTS=true
            if [[ "$TAG_EXISTS" == false ]]; then
              echo "The npm version exists, but $RELEASE_TAG does not exist." >&2
              exit 1
            fi
          fi

          VERSION_WITHOUT_BUILD="${RELEASE_VERSION%%+*}"
          NPM_TAG=latest
          PRERELEASE=false
          if [[ "$VERSION_WITHOUT_BUILD" == *-* ]]; then
            NPM_TAG=next
            PRERELEASE=true
          fi

          echo "tag=$RELEASE_TAG" >> "$GITHUB_OUTPUT"
          echo "npm-tag=$NPM_TAG" >> "$GITHUB_OUTPUT"
          echo "prerelease=$PRERELEASE" >> "$GITHUB_OUTPUT"
          echo "version-changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "tag-exists=$TAG_EXISTS" >> "$GITHUB_OUTPUT"
          echo "npm-exists=$NPM_EXISTS" >> "$GITHUB_OUTPUT"

      - name: Set package version
        if: steps.release.outputs.version-changed == 'true'
        run: npm version "$RELEASE_VERSION" --no-git-tag-version

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

      - name: Build package
        run: bun run build

      - name: Create package archive
        id: package
        run: |
          PACKAGE_FILE=$(npm pack --silent --cache "$RUNNER_TEMP/npm-cache")
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Install package archive
        run: npm install --global --prefix "$RUNNER_TEMP/npm-global" "./${{ steps.package.outputs.file }}" --cache "$RUNNER_TEMP/npm-cache"

      - name: Test installed command
        run: |
          test "$("$RUNNER_TEMP/npm-global/bin/web-app-dev-team" --version)" = "$RELEASE_VERSION"
          "$RUNNER_TEMP/npm-global/bin/web-app-dev-team" --help

      - name: Commit package version
        if: steps.release.outputs.version-changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          git commit -m "chore(release): v$RELEASE_VERSION"

      - name: Create release tag
        if: steps.release.outputs.tag-exists == 'false'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate "${{ steps.release.outputs.tag }}" --message "Release ${{ steps.release.outputs.tag }}"

      - name: Push release commit and tag
        if: steps.release.outputs.tag-exists == 'false'
        run: git push --atomic origin HEAD:main "refs/tags/${{ steps.release.outputs.tag }}"

      - name: Publish package archive
        if: steps.release.outputs.npm-exists == 'false'
        run: npm publish "./${{ steps.package.outputs.file }}" --access public --tag "${{ steps.release.outputs.npm-tag }}"

      - name: Create GitHub prerelease
        if: steps.release.outputs.prerelease == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.release.outputs.tag }}" --verify-tag --generate-notes --prerelease --title "${{ steps.release.outputs.tag }}"

      - name: Create GitHub release
        if: steps.release.outputs.prerelease == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ steps.release.outputs.tag }}" >/dev/null 2>&1 || \
            gh release create "${{ steps.release.outputs.tag }}" --verify-tag --generate-notes --title "${{ steps.release.outputs.tag }}"
