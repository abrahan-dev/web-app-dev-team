name: Publish npm package

on:
  release:
    types:
      - published

permissions:
  contents: read
  id-token: write

concurrency:
  group: publish-npm-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: Publish ${{ github.event.release.tag_name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm

    steps:
      - name: Check out release
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Read Bun version
        id: stack
        run: echo "bun-version=$(jq -r '.runtime.bun' assets/workspace/stack.json)" >> "$GITHUB_OUTPUT"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ steps.stack.outputs.bun-version }}

      - name: Install Node
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run quality checks
        run: bun run check

      - name: Build package
        run: bun run build

      - name: Check release version
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          test "v$PACKAGE_VERSION" = "${{ github.event.release.tag_name }}"

      - name: Create package archive
        id: package
        run: |
          PACKAGE_FILE=$(npm pack --silent --cache "$RUNNER_TEMP/npm-cache")
          echo "file=$PACKAGE_FILE" >> "$GITHUB_OUTPUT"

      - name: Install package archive
        run: npm install --global --prefix "$RUNNER_TEMP/npm-global" "./${{ steps.package.outputs.file }}" --cache "$RUNNER_TEMP/npm-cache"

      - name: Test installed command
        run: |
          "$RUNNER_TEMP/npm-global/bin/web-app-dev-team" --version
          "$RUNNER_TEMP/npm-global/bin/web-app-dev-team" --help

      - name: Select npm tag
        id: npm-tag
        run: |
          PACKAGE_VERSION=$(node -p "require('./package.json').version")
          if [[ "$PACKAGE_VERSION" == *-* ]]; then
            echo "name=next" >> "$GITHUB_OUTPUT"
          else
            echo "name=latest" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish package archive
        run: npm publish "./${{ steps.package.outputs.file }}" --access public --tag "${{ steps.npm-tag.outputs.name }}"
